spring:
  application:
    name: ty
  datasource:
    # 本地 Demo 默认连接 Docker MySQL；部署时使用环境变量覆盖。
    url: ${DB_URL:jdbc:mysql://localhost:3306/tianyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root_123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    # 仅供本地 Demo；部署时必须用至少 32 字节的 JWT_SECRET 覆盖。
    secret: ${JWT_SECRET:ty-local-demo-jwt-secret-not-for-production-2026}
    expire-days: 7

baidu:
  face:
    # 百度智能云人脸识别应用的 API Key / Secret Key，通过环境变量注入，不写入仓库
    api-key: ${BAIDU_FACE_AK:}
    secret-key: ${BAIDU_FACE_SK:}
    group-id: tianyan_users   # 人脸库用户组名
    match-threshold: 80       # 匹配分数阈值 0-100

deepseek:
  # API Key 只从服务端环境变量读取，禁止写入前端或提交到仓库
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
