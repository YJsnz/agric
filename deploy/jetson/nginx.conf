# Install after replacing server_name and certificate paths with a trusted LAN certificate.
limit_req_zone $binary_remote_addr zone=agric_auth:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name agric.example.internal;
    ssl_certificate /etc/agric/tls/fullchain.pem;
    ssl_certificate_key /etc/agric/tls/privkey.pem;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/api/auth/(login|register|face-login)$ {
        limit_req zone=agric_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 650s;
        proxy_buffering off;
    }
}
