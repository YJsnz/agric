name: agric-edge
services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?required}
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql-data:
